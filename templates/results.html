<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results • Rice Quality Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0c0c0c;
            --surface: #161616;
            --surface-2: #1c1c1c;
            --border: #2a2a2a;
            --text: #f0f0f0;
            --text-muted: #8a8a8a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            letter-spacing: -0.01em;
        }

        /* Navbar */
        .navbar-custom {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 18px 0;
        }

        .brand {
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand i {
            color: var(--text-muted);
            font-size: 1.25rem;
        }

        .source-badge {
            background: var(--surface-2);
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Header */
        .page-header {
            margin-bottom: 48px;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Metric Cards */
        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 24px;
            text-align: center;
            height: 100%;
            transition: border-color 0.2s ease;
        }

        .metric-card:hover {
            border-color: #3a3a3a;
        }

        .metric-card .icon {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .metric-card .value {
            font-size: 2.4rem;
            font-weight: 650;
            line-height: 1.1;
            color: var(--text);
            letter-spacing: -0.03em;
        }

        .metric-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }

        /* Image Cards */
        .image-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            height: 100%;
        }

        .image-card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            background: #111;
            display: block;
        }

        .image-card .caption {
            padding: 14px 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .image-card .caption i {
            font-size: 0.95rem;
        }

        /* Back Button */
        .btn-back {
            background: #ffffff;
            color: #111;
            border: none;
            padding: 13px 32px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: #f0f0f0;
            color: #111;
            transform: translateY(-1px);
        }

        .section {
            margin-bottom: 48px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar sticky-top navbar-custom">
    <div class="container">
        <a href="/" class="brand">
            <i class="bi bi-grain"></i>
            Rice Quality Analyzer
        </a>
        <span class="source-badge">
            <i class="bi bi-info-circle"></i>
            {{ source }}
        </span>
    </div>
</nav>

<div class="container py-5">

    <!-- Header -->
    <div class="page-header text-center">
        <h1>Analysis Results</h1>
        <p>Quality metrics of the analyzed sample</p>
    </div>

    <!-- Metrics (Only Purity & Contamination) -->
    <div class="row g-4 justify-content-center section">
        <div class="col-6 col-md-4">
            <div class="metric-card">
                <div class="icon"><i class="bi bi-check-circle"></i></div>
                <div class="value">{{ purity }}%</div>
                <div class="label">Purity</div>
            </div>
        </div>

        <div class="col-6 col-md-4">
            <div class="metric-card">
                <div class="icon"><i class="bi bi-exclamation-circle"></i></div>
                <div class="value">{{ contamination }}%</div>
                <div class="label">Contamination</div>
            </div>
        </div>
    </div>

    <!-- Images -->
    <div class="row g-3 section">
        <div class="col-md-4">
            <div class="image-card">
                <img src="/{{ original }}" alt="Original">
                <div class="caption">
                    <i class="bi bi-image"></i>
                    Original Image
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="image-card">
                <img src="/{{ labeled }}" alt="Detection Result">
                <div class="caption">
                    <i class="bi bi-tags"></i>
                    Detection Result
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="image-card">
                <img src="/{{ thresh }}" alt="Threshold">
                <div class="caption">
                    <i class="bi bi-layers"></i>
                    Binary Threshold
                </div>
            </div>
        </div>
    </div>

    <!-- Back Button -->
    <div class="text-center">
        <a href="/" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Analyze Palay
        </a>
    </div>

</div>

</body>
</html>
